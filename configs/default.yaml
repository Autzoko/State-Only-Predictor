# Base config. Overlay with `--config configs/model/s.yaml --config configs/experiment/...yaml key=value`.
seed: 0
run_name: default
init_from: null            # checkpoint to initialize from (post-training / fine-tuning)
output_root: outputs

data:
  root: data/processed/droid
  # Site-level OOD splits (see sopt/data/splits.py); regexes on `building`, whole connected sites are held out.
  val_sites: ["^CSE2", "^Smith Hall"]                       # UW (~4%)
  test_sites: ["^AHG", "^[Bb]ayes", "^Penn"]                # UT Austin, Edinburgh, Penn (~7.5%)
  id_val_frac: 0.01                                         # in-distribution episodes from training sites
  split_salt: sopt-v1
  train_fraction: 1.0       # E2 data scaling: 0.01 / 0.1 / 1.0 (nested subsets)
  success_only: false
  stride: 2
  eval_stride: null          # val window stride; null -> ctx_len
  left_pad: 0               # allow windows to start this many frames before an episode (rest padding)
  demos_per_task: null      # few-shot subsets for task-labelled datasets (LIBERO)
  speed_aug: [0.8, 1.25]
  speed_aug_prob: 0.5

model:
  objective: ar_flow        # ar_regression | ar_flow | masked
  feature_dim: 17
  patch: 4                  # frames per token (15 Hz -> 0.27 s)
  ctx_len: 96               # context frames (6.4 s)
  horizon: 16               # predicted frames per token (1.07 s)
  d_model: 512
  n_layers: 12
  n_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  qk_norm: true             # required for stable training (see docs/EXPERIMENTS.md, E1 v1)
  head_hidden: 1024
  head_depth: 3
  flow_steps: 10
  mask_ratio: 0.5
  future_mask_prob: 0.5
  goal_cond: false
  goal_probs: [0.2, 0.4, 0.4]  # none / endpoint / keyframe, when goal_cond

aug:
  yaw_deg: 30.0
  input_noise: 0.01         # in normalized units, inputs only

train:
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 2000
  max_steps: 100000
  grad_clip: 1.0
  num_workers: 8
  precision: bf16
  log_every: 50
  eval_every: 2000
  eval_batches: 50
  save_every: 10000
  compile: false
  wandb: false
  wandb_project: sopt
  select_on: auto           # auto (keyframe ES if goal_cond, else min-K ADE) | energy

eval:
  num_samples: 10
  batch_size: 256
  max_batches: 200
