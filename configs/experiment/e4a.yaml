# E4a: DROID -> LIBERO-90 forecasting transfer (stack on model/s.yaml + experiment/e2.yaml + data/libero90.yaml).
# v2 (after v1 showed best checkpoints at the first eval): fine-grained early stopping + step-0 eval.
# Fine-tune: init_from=<DROID best.pt>, lr 3e-5. Scratch: no init_from, lr 3e-4, warmup 300.
data: {root: null}          # set data.root=$SOPT_DATA/processed/libero90
train: {max_steps: 3000, lr: 3.0e-5, warmup_steps: 100, eval_every: 100, eval_batches: 20, select_on: energy,
        eval_at_start: true}
